services:
  postgres:
    image: postgres:15
    container_name: tradeiq_postgres
    environment:
      POSTGRES_USER: tradeiq_user
      POSTGRES_PASSWORD: tradeiq_pass
      POSTGRES_DB: tradeiq_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeiq_user -d tradeiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradeiq_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tradeiq_app
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://tradeiq_user:tradeiq_pass@postgres:5432/tradeiq_db
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
